<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Распределение запасов · Автопилот</title><style>
*{box-sizing:border-box}body{background:#f2f4ef;color:#20362f;font:16px/1.5 Arial,sans-serif;margin:0}main{max-width:1050px;margin:auto;padding:24px}header{background:#19392e;color:white;padding:30px;border-radius:16px}h1{font-size:clamp(29px,5vw,46px);letter-spacing:-1.5px;margin:4px 0}header span{color:#c4eb91}p{margin:6px 0}h2{font-size:22px}section{background:white;border-radius:14px;margin:18px 0;padding:20px}article{border-top:1px solid #dae1d9;padding:12px 0}small{color:#51685a}.amount{color:#356832}time{font-variant-numeric:tabular-nums}#health{margin-top:12px;border-left:3px solid #90ad6a;padding-left:10px}@media(max-width:600px){main{padding:12px}header{padding:20px}}
</style><main><header><span id="mode">Подключение</span><h1>Автопилот запасов</h1><p>Сервис сам проверяет остатки и передаёт задания. Здесь можно проследить, что он решил.</p></header><p id="health" role="status">Ожидаем первый обмен с CRM…</p><section><h2>Перемещения между магазинами</h2><div id="transfer"></div></section><section><h2>Первая поставка нового сезона</h2><div id="allocation"></div></section><section><h2>Журнал проверок</h2><div id="logs"></div></section></main><script>
const el=id=>document.getElementById(id);
function node(tag,text){const n=document.createElement(tag);n.textContent=text;return n}
function draw(kind,jobs){const box=el(kind);box.replaceChildren();if(!jobs.length){box.append(node('p','Заданий пока нет.'));return}
 for(const j of jobs){const card=document.createElement('article');const transfer=kind==='transfer';card.append(node('strong',transfer?j.from+' → '+j.to:j.sku+' · '+j.batch_id));card.append(node('p',j.lines.map(l=>(transfer?l.sku:l.store)+' — '+l.qty+' шт.').join(', ')));card.append(node('p',transfer?'Прогноз выигрыша после доставки: '+j.estimated_gain.toLocaleString('ru-RU')+' ₽. Доставка: '+j.cost+' ₽.':j.method));card.append(node('small',j.sent?'CRM приняла задание':'В очереди на передачу'));box.append(card)}}
async function refresh(){try{const response=await fetch('/status');if(!response.ok)throw Error();const s=await response.json();el('mode').textContent=s.mode;el('health').textContent='Проверка каждые '+s.period+' сек. '+(s.logs[0]?.message||'Первый обмен запускается.');for(const k of ['transfer','allocation'])draw(k,s.jobs.filter(j=>j.kind===k));el('logs').replaceChildren(...s.logs.map(l=>node('p',new Date(l.stamp).toLocaleTimeString('ru-RU')+' · '+l.message)))}catch{el('health').textContent='Связь с сервисом потеряна. Проверьте, что программа запущена.'}finally{setTimeout(refresh,3000)}}refresh();
</script></html>
