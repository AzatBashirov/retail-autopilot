<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Перемещение — план запасов</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#202e2b;font:15px Inter,Arial,sans-serif}header{background:#fff;border-bottom:1px solid #d9ded5}header>div,main{max-width:1150px;margin:auto;padding:20px 26px}header>div,.line,.tools,.metrics{display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-weight:750;font-size:21px;letter-spacing:-1px}.logo{background:#c2eb7c;border-radius:9px;padding:5px 9px;display:inline-block;margin-right:8px}.tag,small{font-size:13px;color:#606b64}.hero{margin:10px 0 22px;padding:32px;border-radius:20px;background:#193a32;color:#fff;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-75px;top:-70px;width:270px;height:270px;border:1px solid #527266;transform:rotate(35deg);box-shadow:0 0 0 24px #21463c,0 0 0 25px #48685b,0 0 0 52px #21463c,0 0 0 53px #48685b;pointer-events:none}.hero>*{position:relative;z-index:1}h1{font-size:clamp(30px,5vw,56px);letter-spacing:-2px;line-height:1.05;margin:18px 0 10px}.hero p{color:#d8e5dc;margin:0;max-width:78%}.ey{font:12px monospace;color:#c3eb8c;letter-spacing:1.2px}.metrics{align-items:stretch}.metric{flex:1;background:#fff;padding:20px;border:1px solid #dce0d6;border-radius:14px}.metric:first-child{background:#e6f4cc}.metric b{display:block;font-size:clamp(24px,3vw,36px);letter-spacing:-1px;margin:7px 0}.tabs{display:flex;gap:5px;margin:24px 0 16px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:1px solid #c8d1c5;background:white;border-radius:8px;padding:9px 14px;color:inherit}button:hover{background:#e7f0dd}.tabs .active,.primary{background:#23483b;color:white}.panel{padding:24px;background:white;border:1px solid #dce0d6;border-radius:15px}h2{margin:0;font-size:23px;letter-spacing:-.7px}p{line-height:1.5}.route{border-top:1px solid #dce0d6;padding:18px 0 12px}.route summary{cursor:pointer;font-weight:650;line-height:1.6}.sum{color:#3a6737;margin-left:14px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px;text-align:left}th,td{padding:10px 8px;border-bottom:1px solid #e3e7df;white-space:nowrap}th{font-size:12px;color:#626c65}input{font:inherit;width:78px;padding:7px;border:1px solid #bbc8ba;border-radius:6px}label{display:inline-flex;align-items:center;gap:8px;margin:5px 14px 5px 0}.tools{flex-wrap:wrap;margin:16px 0}.hint{color:#59675d;font-size:14px}.status{font-weight:bold;color:#336132}button:disabled{opacity:.55;cursor:default}[hidden]{display:none!important}@media(max-width:650px){header>div,main{padding:14px}.hero,.panel{padding:18px}.metrics{gap:5px}.metric{padding:10px}.metric b{font-size:20px}.metric small{font-size:11px}.line{flex-wrap:wrap}.tag{font-size:11px}.hero:after{opacity:.35}.hero p{max-width:100%}}
.route-card{padding:18px 0;border-top:1px solid #dce0d6}.route-card h3{margin:0;font-size:19px}.goods{font-size:16px;margin:9px 0}.route-card details{margin-top:10px;background:#f4f7f1;padding:10px 14px;border-radius:8px}.route-card summary{cursor:pointer;color:#345342}.math{font-weight:650}.actions{display:flex;gap:24px;flex-wrap:wrap;border-top:1px solid #dce0d6;padding:20px 0}.actions small{display:block;max-width:32ch;margin-top:6px;line-height:1.4}.metric small{display:block;line-height:1.35}.metric b{margin-bottom:0}.panel .status{background:#eef4e9;padding:5px 10px;border-radius:12px;font-size:13px}.tabs button{font-weight:600}@media(max-width:650px){.metrics{display:grid;grid-template-columns:1fr 1fr}.metric:first-child{grid-column:1/-1}.hero p{max-width:96%}.hero:after{opacity:.15}.tabs button{font-size:14px}.route-card .line{align-items:baseline}}
</style><header><div><span class="brand"><span class="logo">⇄</span>Перемещение</span><span class="tag">Учебная розничная сеть</span></div></header><main><section class="hero"><span class="ey">ПЛАНИРОВАНИЕ ЗАПАСОВ</span><h1>План перемещений</h1><p>Посмотрите, где товар может остаться до распродажи и какой магазин успеет продать его по полной цене.</p></section><section class="metrics" id="metrics"></section><nav class="tabs"><button id="planTab">Что перевезти</button><button id="dataTab">Изменить данные и доставку</button></nav><section class="panel" id="plan"></section><section class="panel" id="data" hidden></section><p class="hint">Демонстрационные данные · Изменения сохраняются в этом браузере.</p></main>
<script>
const stores=['Арбат','Тверская','Сокол'], items=[['Джинсы прямые','DN-204','32',5900,2600],['Рубашка из поплина','SH-118','M',4200,1900],['Кардиган шерстяной','KN-306','L',6900,3100]];
const initial={days:14,discount:35,rows:[[14,.25,0],[1,1.1,0],[4,.25,0],[1,.85,0],[12,.2,0],[4,.3,0],[3,.3,0],[1,.7,0],[13,.2,0]],routes:[[0,1,1,550],[0,2,2,850],[1,0,1,550],[1,2,2,700],[2,0,2,850],[2,1,2,700]],approved:false};
let s=structuredClone(initial);try{let saved=JSON.parse(localStorage.stockPlan1);if(saved?.rows?.length===9&&saved.routes?.length===6)s=saved}catch{}
const rub=n=>Math.round(n).toLocaleString('ru-RU')+' ₽', get=id=>document.getElementById(id);
function compute(s){
 const budgets=s.rows.map(([stock,rate,incoming])=>({extra:Math.min(stock,Math.max(0,Math.floor(stock+incoming-rate*s.days))),need:Math.max(0,Math.floor(rate*s.days-stock-incoming))}));
 const result=[],pending=s.routes.slice();
 while(pending.length){
 const options=pending.map(r=>{const [a,b,days,fee]=r,lines=[];
 items.forEach((item,i)=>{const from=i*3+a,to=i*3+b,rate=s.rows[to][1],q=Math.min(budgets[from].extra,budgets[to].need,Math.floor(Math.max(0,s.days-days)*rate));
 if(q>0)lines.push({i,q,from,to,gain:q*item[3]*s.discount/100})});
 return {r,lines,net:lines.reduce((a,l)=>a+l.gain,0)-fee}}).sort((x,y)=>y.net-x.net);
 const best=options[0];if(best.net<=0||!best.lines.length)break;
 for(const l of best.lines){budgets[l.from].extra-=l.q;budgets[l.to].need-=l.q}result.push(best);pending.splice(pending.indexOf(best.r),1)
 }return result
}
function save(){try{localStorage.stockPlan1=JSON.stringify(s)}catch{}}
function routeCard(batch){
 const [from,to,days,fee]=batch.r;
 const goods=batch.lines.map(({i,q})=>items[i][0]+' · размер '+items[i][2]+' · <b>'+q+' шт.</b>').join('<br>');
 const reasons=batch.lines.map(({i,q,from,to,gain})=>{
   const [stock,rate,supply]=s.rows[from], [dest,sales,delivery]=s.rows[to];
   return '<p><b>'+items[i][0]+' ('+items[i][2]+')</b>. В магазине '+stores[batch.r[0]]+' доступно '+(stock+supply)+' шт. с учётом сегодняшней поставки. По прогнозу, до скидок здесь купят около '+Math.ceil(rate*s.days)+' шт. В магазине '+stores[batch.r[1]]+' доступно '+(dest+delivery)+' шт., а спрос за тот же срок — около '+Math.ceil(sales*s.days)+' шт.</p><p>Если '+q+' шт. продадутся до скидки '+s.discount+'%, сеть получит дополнительно '+rub(gain)+' ('+q+' × '+rub(items[i][3])+' × '+s.discount+'%).</p>';
 }).join('');
 const gross=batch.lines.reduce((sum,line)=>sum+line.gain,0);
 return '<article class="route-card"><div class="line"><h3>'+stores[from]+' → '+stores[to]+'</h3><strong class="sum">+'+rub(batch.net)+' после доставки</strong></div><p class="goods">'+goods+'</p><small>Отправить сегодня · В пути '+days+' дн. · Доставка '+rub(fee)+'</small><details><summary>Почему сюда и как получилась сумма?</summary>'+reasons+'<p class="math">'+rub(gross)+' − '+rub(fee)+' за доставку = '+rub(batch.net)+'</p></details></article>';
}
function renderPlan(){
 const p=compute(s),count=p.flatMap(x=>x.lines).reduce((a,l)=>a+l.q,0);
 get('metrics').innerHTML=[[rub(p.reduce((a,x)=>a+x.net,0)),'Сколько сеть может заработать дополнительно после оплаты доставки'],[count+' шт.','Сколько товара перевезти'],[rub(p.reduce((a,x)=>a+x.r[3],0)),'Сколько стоит вся доставка']].map(([v,t])=>'<div class="metric"><small>'+t+'</small><b>'+v+'</b></div>').join('');
 get('plan').innerHTML='<div class="line"><h2>Что отправить и куда</h2><span class="status">'+(s.approved?'План утверждён':'Черновик')+'</span></div><p class="hint">До распродажи '+s.days+' дн. Затем цены снизятся на '+s.discount+'%.</p>'+p.map(routeCard).join('')+(p.length?'<div class="actions"><div><button class="primary" id="approve">'+(s.approved?'Снять утверждение':'Утвердить этот план')+'</button><small>'+(s.approved?'План снова станет черновиком.':'Сохранит статус в этом браузере. Для передачи в магазины скачайте таблицу.')+'</small></div><div><button id="export">Скачать таблицу для магазинов</button><small>CSV для Excel с маршрутами, товарами и количеством.</small></div></div>':'<p>Выгодных партий нет. Проверьте остатки, сроки и стоимость доставки во вкладке выше.</p>')+'<details class="route"><summary>На чём основан прогноз?</summary><p>Расчёт предполагает, что до распродажи спрос сохранится, а излишки затем продадутся со скидкой. Сегодняшние поставки учитываются в остатках. Сначала выбирается маршрут с наибольшим прогнозным выигрышем после оплаты доставки, затем остатки для остальных маршрутов пересчитываются.</p></details>';
if(p.length){get('approve').onclick=()=>{s.approved=!s.approved;save();renderPlan()};get('export').onclick=()=>{let rows=[['Статус','Откуда','Куда','Дни в пути','Артикул','Размер','Количество','Выигрыш до доставки, руб.','Доставка партии, руб. (один раз)','Эффект партии, руб. (один раз)']];p.forEach(x=>x.lines.forEach((l,i)=>rows.push([s.approved?'Утверждён':'Черновик',stores[x.r[0]],stores[x.r[1]],x.r[2],items[l.i][1],items[l.i][2],l.q,l.gain,i?'':x.r[3],i?'':x.net])));let url=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(r=>r.join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='plan_peremescheniy.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}}}
function field(key,value,label,max,step=1,min=0){return '<input aria-label="'+label+'" data-key="'+key+'" type="number" required min="'+min+'" max="'+max+'" step="'+step+'" value="'+value+'">'}
function renderData(){get('data').innerHTML='<form id="form"><h2>Когда начнётся распродажа?</h2><p class="hint">Для первой проверки измените срок до скидок с 14 до 2 дней. Затем нажмите кнопку внизу, чтобы увидеть, какие партии ещё успеют продаться.</p><div class="tools"><div><label>Дней до уценки '+field('days',s.days,'Дней до уценки',365,1,1)+'</label><label>Скидка, % '+field('discount',s.discount,'Скидка',100)+'</label></div></div><h3>Сколько товара есть и сколько покупают</h3><p class="hint">Остаток — сколько штук сейчас в магазине. Спрос — средние продажи за день, когда товар был в наличии. Например, 0,5 означает одну продажу за два дня.</p><div class="scroll"><table><tr><th>Товар / размер</th><th>Магазин</th><th>Цена</th><th>Остаток, шт.</th><th>Спрос, шт./день</th><th>Поставка сегодня, шт.</th></tr>'+s.rows.map((row,k)=>{let it=items[Math.floor(k/3)];return '<tr><td>'+it[0]+' · '+it[2]+'</td><td>'+stores[k%3]+'</td><td>'+rub(it[3])+'</td>'+row.map((n,j)=>'<td>'+field('rows.'+k+'.'+j,n,[it[0],stores[k%3],['Остаток','Спрос','Поставка'][j]].join(' '),100000,j===1?.01:1)+'</td>').join('')+'</tr>'}).join('')+'</table></div><h3>Сколько времени и денег занимает доставка?</h3><p class="hint">Введите срок в днях и цену за всю партию по каждому направлению.</p><div class="scroll"><table><tr><th>Маршрут</th><th>В пути, дней</th><th>Стоимость, ₽</th></tr>'+s.routes.map(([a,b,d,f],k)=>'<tr><td>'+stores[a]+' → '+stores[b]+'</td><td>'+field('routes.'+k+'.2',d,'Длительность маршрута',365)+'</td><td>'+field('routes.'+k+'.3',f,'Тариф маршрута',1000000)+'</td></tr>').join('')+'</table></div><div class="actions"><div><button class="primary">Сохранить и показать новый план</button><small>Пересчитает партии по введённым значениям и откроет результат.</small></div><div><button type="button" id="reset">Вернуть данные примера</button><small>Заменит ваши значения исходными и снимет утверждение.</small></div></div></form>';get('form').onsubmit=e=>{e.preventDefault();for(const el of e.target.querySelectorAll('input')){let path=el.dataset.key.split('.');if(path.length===1)s[path[0]]=el.valueAsNumber;else s[path[0]][path[1]][path[2]]=el.valueAsNumber}s.approved=false;save();renderPlan();tab(false)};get('reset').onclick=()=>{if(confirm('Восстановить демонстрационные значения?')){s=structuredClone(initial);save();renderPlan();renderData()}}}
function tab(d){get('metrics').hidden=d;get('plan').hidden=d;get('data').hidden=!d;get('planTab').classList.toggle('active',!d);get('dataTab').classList.toggle('active',d);if(!d)window.scrollTo(0,0)}
get('planTab').onclick=()=>tab(false);get('dataTab').onclick=()=>tab(true);renderPlan();renderData();tab(false);
</script></html>
